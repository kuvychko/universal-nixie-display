; Dekatron controller/PSU bring-up firmware (Gate 2: HV converter). Not the dekatron firmware.
; RP2040-Zero, arduino-pico core. Driven by tools/hv_bringup.py over USB serial.
; Build:  pio run -d firmware/dekatron-bringup
; Flash:  hold BOOT, plug USB, then  pio run -d firmware/dekatron-bringup -t upload

[env:rp2040zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.3
build_flags =
    -Wall
