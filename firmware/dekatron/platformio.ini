; Dekatron controller firmware (RP2040-Zero, arduino-pico core). Spec: README.md.
; Build:  pio run -d firmware/dekatron
; Flash:  hold BOOT, plug USB, copy .pio/build/rp2040zero/firmware.uf2 to the RPI-RP2 drive
;         (or pio run -d firmware/dekatron -t upload, with picotool's driver installed)

[env:rp2040zero]
; Same platform commit as firmware/dekatron-bringup (docs/development.md).
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.3
build_flags =
    -Wall
    -Wl,-u,_printf_float
    -I../common
