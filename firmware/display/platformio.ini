; Display firmware - ESP32 "Cheap Yellow Display" (ESP32-2432S028R), the instrument's I2C master.
; Build:  pio run -d firmware/display
; Flash:  pio run -d firmware/display -t upload --upload-port COMx
; Platform pinned as nanovolt-divider (docs/development.md#toolchains).

[platformio]
default_envs = cyd

[env:cyd]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Core log output would interleave with SCPI responses on the same serial port.
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=0
    -DDISP_FW_VERSION=\"0.1\"
    -I../common
