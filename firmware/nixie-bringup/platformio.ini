; Nixie board bring-up firmware (Gates 2-6: 12 V switch, HV monitor, drivers, ES100). Not the Nixie
; controller firmware. RP2040-Zero, arduino-pico core, as firmware/dekatron-bringup.
; Build:  pio run -d firmware/nixie-bringup
; Flash:  hold BOOT, plug USB, then  pio run -d firmware/nixie-bringup -t upload

[env:rp2040zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.3
build_flags =
    -Wall
    -Wl,-u,_printf_float
