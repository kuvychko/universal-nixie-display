<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" font-family="system-ui, sans-serif" font-size="13">
<title>Proposed front view of the display, not to scale: six IN-14 Nixies in a row on top of the enclosure; on the front, the touchscreen at the left and, at the right, the A101 dekatron end-on and the rotary encoder; the enclosure sits on a tilt base</title>
<rect width="600" height="340" fill="#fff"/>
<g stroke="#333" stroke-width="2" fill="none">
  <!-- enclosure and tilt base -->
  <rect x="60" y="140" width="480" height="140" rx="8"/>
  <path d="M90 280L110 310H490L510 280"/>
  <!-- six IN-14 tubes standing on top -->
  <rect x="135" y="40" width="34" height="100" rx="14"/>
  <rect x="195" y="40" width="34" height="100" rx="14"/>
  <rect x="255" y="40" width="34" height="100" rx="14"/>
  <rect x="315" y="40" width="34" height="100" rx="14"/>
  <rect x="375" y="40" width="34" height="100" rx="14"/>
  <rect x="435" y="40" width="34" height="100" rx="14"/>
  <!-- touchscreen, front left -->
  <rect x="90" y="165" width="170" height="95" rx="3"/>
  <!-- A101 end-on, front right -->
  <circle cx="420" cy="200" r="32"/>
  <!-- rotary encoder, front right -->
  <circle cx="420" cy="255" r="12"/>
</g>
<!-- glowing numerals and dekatron glow -->
<g fill="#ff6a00" font-size="34" font-weight="600" text-anchor="middle" opacity="0.8">
  <text x="152" y="102">1</text>
  <text x="212" y="102">2</text>
  <text x="272" y="102">3</text>
  <text x="332" y="102">4</text>
  <text x="392" y="102">5</text>
  <text x="452" y="102">6</text>
</g>
<circle cx="420" cy="174" r="6" fill="#ff6a00" opacity="0.8"/>
<g fill="#222">
  <text x="300" y="24" text-anchor="middle">six IN-14 Nixies in a row, on top</text>
  <text x="175" y="216" text-anchor="middle">2.8" touchscreen</text>
  <text x="175" y="233" text-anchor="middle" font-size="12">(ESP32)</text>
  <text x="376" y="196" text-anchor="end">A101 dekatron,</text>
  <text x="376" y="212" text-anchor="end">end-on</text>
  <text x="440" y="259">encoder</text>
  <text x="300" y="330" text-anchor="middle" font-size="12">tilt base</text>
</g>
<text x="300" y="300" text-anchor="middle" fill="#666" font-size="12" font-style="italic">proposed arrangement, not to scale</text>
</svg>
